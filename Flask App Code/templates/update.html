<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">Update User</h1>
    <form method="POST">
        {{ form.csrf_token }}
        <div class="row g-2">
            <div class="col-md-2">{{ form.first_name(class="form-control") }}</div>
            <div class="col-md-2">{{ form.last_name(class="form-control") }}</div>
            <div class="col-md-3">{{ form.email(class="form-control") }}</div>
            <div class="col-md-2">{{ form.phone(class="form-control") }}</div>
            <div class="col-md-3">{{ form.address(class="form-control") }}</div>
        </div>
        <button type="submit" class="btn btn-success mt-2">Update</button>
        <a href="/" class="btn btn-secondary mt-2">Cancel</a>
    </form>
</div>
</body>
</html>
